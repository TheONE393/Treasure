<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treasure Hunt Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Admin Dashboard</h1>
    <p>Monitor teams and reset times</p>
    <div class="table-wrap">
      <table>
    <thead>
      <tr>
        <th>Team</th>
        <th>Current Question</th>
        <th>Time Spent</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="team-table">
      <!-- Teams will populate here -->
    </tbody>
      </table>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
