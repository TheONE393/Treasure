<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Ultimate Showdown</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LOGIN -->
  <div class="container" id="login-container">
    <h1>The Ultimate Showdown</h1>
    <p>Welcome Teams! Enter your team name and password to begin your journey.</p>
    <form id="login-form">
      <input type="text" id="teamName" placeholder="Team Name" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Begin Adventure</button>
    </form>
    <p id="login-error" class="error"></p>
  </div>

  <!-- HUNT -->
  <div class="container hidden" id="hunt-container">
    <h2 id="team-title"></h2>
    <div id="question-display"></div>
    <form id="answer-form">
      <input type="text" id="answer" placeholder="Enter your answer here" required>
      <button type="submit">Submit</button>
    </form>
    <p id="feedback" class="feedback"></p>
  </div>

  <footer>
    <p>Hosted by "The Bio Club"</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
